    <style>
        .video-grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 5%;
        }
        
        .video-wrapper {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 9/16;
            background: #000;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        .play-icon svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            margin-left: 3px;
        }
        .video-wrapper:hover .play-icon {
            background: rgba(139, 92, 246, 0.9);
            border-color: rgba(139, 92, 246, 1);
            transform: translate(-50%, -50%) scale(1.15);
        }

        .video-grid-5 video.old-style {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            background: #000;
        }
        @media (max-width: 1100px) {
            .video-grid-5 { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 700px) {
            .video-grid-5 { grid-template-columns: repeat(2, 1fr); }
        }
        
        .banner-wrapper {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 1400px;
            margin: 2rem auto 4rem;
            background: #000;
        }
        .banner-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }
        .banner-wrapper:hover .play-icon {
            background: rgba(139, 92, 246, 0.9);
            border-color: rgba(139, 92, 246, 1);
            transform: translate(-50%, -50%) scale(1.15);
        }

        .banner-video.old-style {
            width: 100%;
            max-width: 1400px;
            margin: 2rem auto 4rem;
            padding: 0 5%;
            display: block;
            border-radius: 8px;
            cursor: pointer;
        }
        .banner-video video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            background: #000;
        }
    </style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const thumbs = document.querySelectorAll(".video-thumb");
    const modal = document.getElementById("videoModal");
    const modalIframe = document.getElementById("modalIframe");
    const closeModal = document.querySelector(".close-modal");

    thumbs.forEach(thumb => {
        thumb.addEventListener("click", () => {
            modalIframe.src = thumb.getAttribute("data-src");
            modal.classList.add("active");
        });
    });

    closeModal.addEventListener("click", () => {
        modal.classList.remove("active");
        modalIframe.src = "";
    });

    modal.addEventListener("click", (e) => {
        if (e.target === modal) {
            modal.classList.remove("active");
            modalIframe.src = "";
        }
    });
});
</script>
