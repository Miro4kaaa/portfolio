<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Анна Логунова</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/redesign.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="images/logo.png" alt="Главная"></a>
            
            <div class="menu-toggle">☰</div>
            <ul class="nav-links">
                <li><a href="index.html">Обо мне</a></li>
                <li><a href="projects.html">Кейсы</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 250px); position: relative; overflow: hidden;">
        <!-- Фоновые неоновые пятна -->
        <div class="neon-blob blob-purple"></div>
        <div class="neon-blob blob-blue"></div>

        <h1 class="section-title-v2 light" style="text-align: center; margin-bottom: 3rem; position: relative; z-index: 10; padding:0;  font-size: clamp(2rem, 5vw, 4.5rem);"><span class="amb">С</span>ВЯЖИТЕСЬ<br><span style="color: var(--primary-color);">СО МНОЙ</span></h1>
        
        <div class="contact-container glass-card" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
            <p style="text-align: center; margin-bottom: 2rem; color: #e2e8f0; position: relative; z-index: 10;">
                Я открыта к сотрудничеству!
            </p>

            <div class="contact-item">
                <i class="bi bi-envelope" style="font-size: 1.5rem; color: #8b5cf6;"></i>
                <div>
                    <span style="display: block; font-size: 0.9rem; color: #cbd5e1;">Email</span>
                    <a href="mailto:brandianna@mail.ru" style="color: #fff; font-weight: 500;">brandianna@mail.ru</a>
                </div>
            </div>

            <div class="contact-item">
                <i class="bi bi-telegram" style="font-size: 1.5rem; color: #8b5cf6;"></i>
                <div>
                    <span style="display: block; font-size: 0.9rem; color: #cbd5e1;">Telegram</span>
                    <a href="https://t.me/brandianna" target="_blank" style="color: #fff; font-weight: 500;">@brandianna</a>
                </div>
            </div>

            
            
            
            <div class="feedback-form" style="margin-top: 2.5rem; position: relative; z-index: 10; background: rgba(255, 255, 255, 0.03); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <h3 style="color: #fff; margin-bottom: 1rem; font-size: 1.2rem; text-align: center; font-weight: 600;">Написать</h3>
                <form action="https://formsubmit.co/brandianna@mail.ru" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="text" name="Имя" placeholder="Ваше имя" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; outline: none; font-family: inherit;">
                    <input type="email" name="email" placeholder="Ваш Email (для связи)" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; outline: none; font-family: inherit;">
                    <textarea name="Письмо" placeholder="Ваше сообщение" rows="3" required style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; outline: none; resize: vertical; font-family: inherit;"></textarea>
                    
                    <!-- FormSubmit settings -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="Новое сообщение с портфолио!">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_next" id="nextUrl" value="">
                    <script>
                        // Динамически вычисляем правильный URL для страницы успеха
                        document.getElementById('nextUrl').value = window.location.href.split('?')[0].replace('contact.html', 'success.html');
                    </script>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; border: none; cursor: pointer; font-weight: 600;">Отправить</button>
                </form>
            </div>

        </div>
    </main>

    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="js/script.js"></script>

    

    


    


    


    


    


    


    


    <footer class="site-footer" style="padding: 4rem 5% 2rem; text-align: center; border: none; margin-top: 2rem;">
        <div class="social-links" style="display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem;">
            <a href="https://t.me/brandianna" target="_blank" aria-label="Telegram" class="sprite-social sprite-tg"></a>
            <a href="https://vk.ru/brand_i_anna" target="_blank" aria-label="VKontakte" class="sprite-social sprite-vk"></a>
            <a href="https://www.tiktok.com/@virdelia.ai" target="_blank" aria-label="TikTok" class="sprite-social sprite-tt"></a>
        </div>
        <p style="color: #64748b; font-size: 0.9rem; margin: 0;">&copy; 2026 Анна Логунова. Создано с помощью AI-подхода.</p>
    </footer>

</body>
</html>
